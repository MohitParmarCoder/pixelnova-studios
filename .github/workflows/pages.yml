name: Deploy to GitHub Pages

on:
  # Deploy only from the default branch. The github-pages environment only
  # permits the default branch, so triggering on feature branches would
  # always fail the deploy job. Merge to master => automatic free deploy.
  push:
    branches:
      - master
      - main
  # Allow manual runs from the Actions tab at any time.
  workflow_dispatch:

# Permissions required for the official GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── SITE TAKEN DOWN ────────────────────────────────────────────────────
      # The public site is intentionally offline. The build publishes ONLY a
      # 404 page and no index.html, so every URL (company site, games, Orbit
      # Hopper) returns HTTP 404. To bring the site back, restore the original
      # "Build site" step from git history (before this commit) and redeploy.
      - name: Build site (takedown — 404 only)
        run: |
          mkdir -p _site
          cat > _site/404.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8">
          <meta name="robots" content="noindex,nofollow">
          <title>Not available</title></head>
          <body style="background:#04050e;color:#888;font-family:system-ui,sans-serif;
          display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center">
          <p>This site is not available.</p></body></html>
          HTML
          # No index.html on purpose → root and all paths serve 404.html with a 404 status.
          touch _site/.nojekyll

      - name: Setup Pages
        # enablement:true auto-enables GitHub Pages and sets the source to
        # "GitHub Actions" — no manual Settings step required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
