<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelNova Arcade</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #1a1140 0%, #0a0818 55%, #05040d 100%);
    color: #eaeaff; min-height: 100vh; padding: 32px 16px 64px;
  }
  header { text-align: center; margin-bottom: 36px; }
  h1 {
    font-size: clamp(30px, 7vw, 54px); letter-spacing: 2px; font-weight: 800;
    background: linear-gradient(90deg, #00eaff, #b06bff, #ff5599);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 8px; color: #9aa0c8; font-size: 15px; }
  .search-wrap { max-width: 400px; margin: 18px auto 0; position: relative; }
  .search-wrap input {
    width: 100%; padding: 10px 16px 10px 40px; border-radius: 12px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    color: #eaeaff; font-size: 15px; outline: none;
  }
  .search-wrap input::placeholder { color: #6b7099; }
  .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 10px; font-size: 15px; }
  .grid {
    max-width: 1100px; margin: 28px auto 0; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  a.card {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 20px 18px; overflow: hidden;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.card:hover { transform: translateY(-4px); border-color: var(--c); box-shadow: 0 10px 30px -10px var(--c); }
  a.card.hidden { display: none; }
  .chip { width: 44px; height: 44px; border-radius: 11px; margin-bottom: 12px;
    background: var(--c); box-shadow: 0 0 20px -2px var(--c); }
  .name { font-size: 17px; font-weight: 700; }
  .tag { margin-top: 4px; font-size: 12px; color: #9aa0c8; }
  footer { text-align: center; margin-top: 48px; color: #6b7099; font-size: 13px; }
  footer a { color: #8a90c8; }
  #count { color: #6b7099; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
  <header>
    <h1>PixelNova Arcade</h1>
    <div class="sub">101 one-touch games · no download · play instantly</div>
    <div id="count"></div>
    <div class="search-wrap"><input type="search" id="search" placeholder="Search games…" autocomplete="off"></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Built by PixelNova Studios ·
    <a href="../">Company site</a> ·
    <a href="../game/">Orbit Hopper</a>

      { dir: 'shape-recall',    name: 'Shape Tangram',    tag: 'Fit geometric pieces into the silhouette',      c: '#673AB7' },

      { dir: 'neon-path',       name: 'Neon Path',       tag: 'Roll through the tube',    c: '#00FFFF' },
      { dir: 'block-blast',     name: 'Block Blast',     tag: 'Blast connected blocks',   c: '#FF5722' },
      { dir: 'line-breaker',    name: 'Ricochet',    tag: 'Bounce one ball to hit all 8 targets',        c: '#FFEB3B' },
      { dir: 'orbit-tap',       name: 'Orbit Tap',       tag: 'Tap orbiting planets',     c: '#9C27B0' },
      { dir: 'mirror-tap',      name: 'Mirror Tap',      tag: 'Mirror the pattern',       c: '#00BCD4' },
      { dir: 'chain-tap',       name: 'Chain Tap',       tag: 'Tap numbers in order',     c: '#FF9800' },
    ];

    var unique = [];
    var seen = {};
    for (var i = 0; i < GAMES.length; i++) {
      if (!seen[GAMES[i].dir]) { seen[GAMES[i].dir] = true; unique.push(GAMES[i]); }
    }
    GAMES = unique;

    var grid = document.getElementById('grid');
    for (var j = 0; j < GAMES.length; j++) {
      var g = GAMES[j];
      var a = document.createElement('a');
      a.className = 'card';
      a.style.setProperty('--c', g.c);
      a.href = g.href || (g.dir + '/');
      a.dataset.name = g.name.toLowerCase();
      a.innerHTML =
        '<div class="chip"></div>' +
        '<div class="name">' + g.name + '</div>' +
        '<div class="tag">' + g.tag + '</div>';
      grid.appendChild(a);
    }

    document.getElementById('count').textContent = GAMES.length + ' games';

    document.getElementById('search').addEventListener('input', function() {
      var q = this.value.toLowerCase();
      var cards = grid.querySelectorAll('.card');
      for (var k = 0; k < cards.length; k++) {
        cards[k].classList.toggle('hidden', q && cards[k].dataset.name.indexOf(q) === -1);
      }
    });
  </script>
</body>
